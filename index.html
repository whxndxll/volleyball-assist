<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/volleyball-assist/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/volleyball-assist/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Gerenciador de rachas de vôlei" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('va-theme');
          var dark = t ? t === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Vôlei Assist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
